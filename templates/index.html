<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Classificador de Emails</title>
    <style>
      body {
        font-family: Arial;
        margin: 40px;
      }
      textarea {
        width: 100%;
        height: 150px;
      }
      button {
        padding: 10px 20px;
        margin-top: 10px;
      }
      .result {
        margin-top: 20px;
        padding: 15px;
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <h2>Classificação Automática de Emails</h2>

    <form action="/analyze" method="post" enctype="multipart/form-data">
      <label>Email (cole o texto):</label><br />
      <textarea
        name="email_text"
        rows="8"
        cols="80"
        placeholder="Cole aqui o conteúdo do email..."
      >
{{ email_text or "" }}</textarea
      >

      <br /><br />

      <label>Ou envie um arquivo (.txt ou .pdf):</label><br />
      <input type="file" name="file" accept=".txt,.pdf" />

      <br /><br />
      <button type="submit">Analisar</button>
    </form>

    {% if error %}
    <p style="color: red">{{ error }}</p>
    {% endif %} {% if category %}
    <hr />
    <p><strong>Classificação:</strong> {{ category }}</p>
    <p><strong>Resposta sugerida:</strong></p>
    <p>{{ reply }}</p>
    {% endif %}
  </body>
</html>
