<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analisador de Emails</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          Arial,
          sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        line-height: 1.5;
      }

      .card {
        background: #020617;
        padding: 40px 32px;
        border-radius: 24px;
        width: 100%;
        max-width: 520px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
        border: 1px solid rgba(99, 102, 241, 0.15);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        font-size: 28px;
        margin-bottom: 32px;
        text-align: center;
        font-weight: 700;
        color: #f8fafc; /* Cor branca suave */
        letter-spacing: -0.5px;
        width: 100%;
      }

      #form {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      textarea {
        width: 100%;
        height: 160px;
        margin-bottom: 24px;
        border-radius: 14px;
        padding: 20px;
        border: 2px solid #334155;
        background: #1e293b;
        color: #f8fafc;
        resize: none;
        font-family: inherit;
        font-size: 15px;
        line-height: 1.6;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      textarea:focus {
        outline: none;
        border-color: #6366f1;
        background: #0f172a;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
        transform: translateY(-1px);
      }

      textarea::placeholder {
        color: #94a3b8;
        font-size: 14px;
      }

      /* BOTÃO DE UPLOAD ESTILIZADO */
      .upload-container {
        position: relative;
        margin-bottom: 28px;
        width: 100%;
      }

      .custom-upload {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 28px 20px;
        background: linear-gradient(145deg, #1e293b, #0f172a);
        border: 2px dashed #475569;
        border-radius: 14px;
        color: #cbd5e1;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        font-size: 14px;
        gap: 12px;
      }

      .custom-upload:hover {
        background: linear-gradient(145deg, #2d3748, #1e293b);
        border-color: #818cf8;
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      }

      .custom-upload:active {
        transform: translateY(0);
      }

      .upload-icon {
        font-size: 40px;
        opacity: 0.9;
        display: block;
      }

      .upload-text {
        font-weight: 600;
        font-size: 16px;
        color: #e2e8f0;
      }

      .upload-subtext {
        display: block;
        font-size: 13px;
        opacity: 0.7;
        max-width: 80%;
        margin: 0 auto;
      }

      .file-info {
        margin-top: 16px;
        padding: 14px 18px;
        background: rgba(99, 102, 241, 0.12);
        border-radius: 10px;
        font-size: 13px;
        color: #cbd5e1;
        display: none;
        align-items: center;
        gap: 12px;
        animation: fadeIn 0.3s ease;
        width: 100%;
        border: 1px solid rgba(99, 102, 241, 0.2);
      }

      .file-info-icon {
        font-size: 20px;
        flex-shrink: 0;
      }

      .file-name {
        flex-grow: 1;
        word-break: break-word;
        font-weight: 500;
      }

      .file-size {
        color: #94a3b8;
        white-space: nowrap;
        flex-shrink: 0;
        font-size: 12px;
        background: rgba(0, 0, 0, 0.2);
        padding: 4px 10px;
        border-radius: 20px;
      }

      input[type="file"] {
        display: none;
      }

      /* BOTÃO ANALISAR */
      button[type="submit"] {
        width: 100%;
        padding: 20px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        font-size: 17px;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 8px;
        letter-spacing: 0.3px;
      }

      button[type="submit"]:hover:not(:disabled) {
        background: linear-gradient(135deg, #4f46e5, #4338ca);
        transform: translateY(-3px);
        box-shadow: 0 15px 30px rgba(99, 102, 241, 0.5);
      }

      button[type="submit"]:active:not(:disabled) {
        transform: translateY(-1px);
      }

      button[type="submit"]:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none !important;
      }

      /* LOADING */
      .loading {
        text-align: center;
        display: none;
        margin-top: 28px;
        padding: 20px;
        background: rgba(99, 102, 241, 0.12);
        border-radius: 12px;
        font-size: 15px;
        color: #cbd5e1;
        animation: pulse 1.5s infinite;
        width: 100%;
        border: 1px solid rgba(99, 102, 241, 0.2);
      }

      .loading-spinner {
        display: inline-block;
        width: 22px;
        height: 22px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        border-top-color: #6366f1;
        animation: spin 1s linear infinite;
        margin-right: 12px;
        vertical-align: middle;
      }

      /* MODAL RESPONSIVO */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        display: none;
        align-items: flex-start; /* Mudado de center para flex-start */
        justify-content: center;
        padding: 20px;
        z-index: 1000;
        animation: fadeIn 0.3s ease;
        overflow-y: auto; /* Permite scroll se necessário */
      }

      .modal-content {
        background: linear-gradient(145deg, #020617, #0f172a);
        padding: 30px; /* Reduzido de 36px */
        border-radius: 20px;
        width: 100%;
        max-width: 480px;
        max-height: 85vh; /* LIMITE DE ALTURA */
        overflow-y: auto; /* Scroll interno se ultrapassar */
        border: 1px solid rgba(99, 102, 241, 0.25);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
        margin-top: 40px; /* Espaço do topo */
        margin-bottom: 40px; /* Espaço do bottom */
      }

      /* Ajuste de espaçamento interno */
      .summary-box,
      .response-box {
        max-height: 200px; /* Altura máxima fixa */
        overflow-y: auto; /* Scroll interno */
        scrollbar-width: none; /* Firefox */
        -ms-overflow-style: none; /* IE/Edge */
      }

      .summary-box::-webkit-scrollbar,
      .response-box::-webkit-scrollbar {
        display: none; /* Chrome/Safari/Opera */
      }

      /* RESPONSIVO PARA MOBILE */
      @media (max-width: 600px) {
        .modal {
          padding: 15px;
          align-items: flex-start;
        }

        .modal-content {
          max-height: 90vh; /* Mais altura em mobile */
          padding: 24px 20px;
          margin-top: 20px;
          margin-bottom: 20px;
        }

        .summary-box,
        .response-box {
          max-height: 150px;
        }
      }

      /* Melhorando o scroll */
      .modal-content::-webkit-scrollbar {
        width: 8px;
      }

      .modal-content::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
      }

      .modal-content::-webkit-scrollbar-thumb {
        background: rgba(99, 102, 241, 0.5);
        border-radius: 4px;
      }

      .modal-content::-webkit-scrollbar-thumb:hover {
        background: rgba(99, 102, 241, 0.7);
      }

      .classification-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 24px;
        width: 100%;
      }

      .badge {
        padding: 12px 28px;
        border-radius: 50px;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 16px;
        text-transform: uppercase;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        text-align: center;
        min-width: 180px;
      }

      .Produtivo {
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
      }

      .Improdutivo {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: white;
      }

      .modal-title {
        font-size: 22px;
        font-weight: 700;
        color: #f8fafc;
        text-align: center;
        margin-bottom: 8px;
      }

      .modal-subtitle {
        font-size: 14px;
        color: #94a3b8;
        text-align: center;
        margin-bottom: 28px;
      }

      .summary-box {
        background: rgba(255, 255, 255, 0.05);
        padding: 20px;
        border-radius: 12px;
        margin: 0 0 24px 0;
        font-size: 15px;
        line-height: 1.6;
        color: #e2e8f0;
        border-left: 4px solid #6366f1;
        width: 100%;
      }

      .response-box {
        background: rgba(99, 102, 241, 0.12);
        padding: 20px;
        border-radius: 12px;
        margin: 0 0 32px 0;
        font-size: 15px;
        line-height: 1.7;
        color: #e2e8f0;
        white-space: pre-line;
        font-family: "SF Mono", "Monaco", "Courier New", monospace;
        width: 100%;
        border: 1px solid rgba(99, 102, 241, 0.2);
      }

      .section-label {
        display: block;
        font-weight: 600;
        margin-bottom: 12px;
        color: #94a3b8;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .modal-buttons {
        display: flex;
        gap: 16px;
        margin-top: 8px;
        width: 100%;
      }

      .secondary {
        flex: 1;
        padding: 16px;
        border: none;
        border-radius: 12px;
        background: #1e293b;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        font-size: 15px;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border: 1px solid #334155;
      }

      .secondary:hover {
        background: #2d3748;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      }

      .copy-btn {
        flex: 1;
        padding: 16px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        font-size: 15px;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .copy-btn:hover {
        background: linear-gradient(135deg, #7c3aed, #6d28d9);
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
      }

      /* TOAST */
      .toast {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(-20px);
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: #fff;
        padding: 18px 28px;
        border-radius: 14px;
        font-weight: 600;
        box-shadow: 0 20px 40px rgba(220, 38, 38, 0.4);
        display: none;
        z-index: 9999;
        animation: slideDown 0.3s ease forwards;
        max-width: 90%;
        text-align: center;
        font-size: 15px;
        backdrop-filter: blur(10px);
      }

      /* ANIMAÇÕES */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      /* RESPONSIVO */
      @media (max-width: 600px) {
        .card {
          padding: 32px 24px;
          border-radius: 20px;
        }

        h1 {
          font-size: 24px;
          margin-bottom: 28px;
        }

        .modal-content {
          padding: 28px 24px;
        }

        .modal-buttons {
          flex-direction: column;
          gap: 12px;
        }

        .badge {
          font-size: 16px;
          padding: 10px 24px;
          min-width: 160px;
        }

        textarea {
          height: 140px;
          padding: 18px;
        }

        .custom-upload {
          padding: 24px 20px;
        }
      }
    </style>
  </head>
  <body>
    <!-- TOAST DE ERRO -->
    <div id="toast" class="toast"></div>

    <!-- CARD PRINCIPAL -->
    <div class="card">
      <h1>📧 Analisador Inteligente de Emails</h1>

      <form id="form">
        <!-- ÁREA DE TEXTO -->
        <textarea
          name="email_text"
          id="emailText"
          placeholder="Cole o texto do email aqui... ou use o botão abaixo para anexar um arquivo"
        ></textarea>

        <!-- UPLOAD ESTILIZADO -->
        <div class="upload-container">
          <label for="fileInput" class="custom-upload">
            <span class="upload-icon">📎</span>
            <span class="upload-text">Anexar arquivo</span>
            <span class="upload-subtext"
              >Arraste ou clique para fazer upload (.txt ou .pdf)</span
            >
          </label>
          <input
            type="file"
            id="fileInput"
            name="file"
            accept=".txt,.pdf"
            onchange="updateFileName()"
          />
          <div class="file-info" id="fileInfo">
            <span class="file-info-icon">📄</span>
            <span class="file-name" id="fileName"></span>
            <span class="file-size" id="fileSize"></span>
          </div>
        </div>

        <!-- BOTÃO ANALISAR -->
        <button type="submit" id="submitBtn">
          <span>🔍</span>
          <span>Analisar Email</span>
        </button>
      </form>

      <!-- LOADING -->
      <div class="loading" id="loading">
        <span class="loading-spinner"></span>
        Processando e analisando o email...
      </div>
    </div>

    <!-- MODAL DE RESULTADOS -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <div class="classification-header">
          <div id="badge" class="badge"></div>
          <span class="modal-title">Classificação do Email</span>
          <span class="modal-subtitle" id="classificationSubtitle"></span>
        </div>

        <div class="summary-box">
          <span class="section-label">Resumo</span>
          <span id="summary"></span>
        </div>

        <div class="response-box">
          <span class="section-label">Resposta Sugerida</span>
          <span id="response"></span>
        </div>

        <div class="modal-buttons">
          <button class="copy-btn" onclick="copyResponse()">
            📋 Copiar Resposta
          </button>
          <button class="secondary" onclick="resetApp()">
            📩 Analisar Outro Email
          </button>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("form");
      const loading = document.getElementById("loading");
      const modal = document.getElementById("modal");
      const submitBtn = document.getElementById("submitBtn");
      const emailText = document.getElementById("emailText");
      const fileInput = document.getElementById("fileInput");
      const classificationSubtitle = document.getElementById(
        "classificationSubtitle",
      );

      // Mostrar nome do arquivo selecionado
      function updateFileName() {
        const fileInfo = document.getElementById("fileInfo");
        const fileName = document.getElementById("fileName");
        const fileSize = document.getElementById("fileSize");

        if (fileInput.files.length > 0) {
          const file = fileInput.files[0];
          const sizeInKB = (file.size / 1024).toFixed(2);

          fileName.textContent = file.name;
          fileSize.textContent = `${sizeInKB} KB`;
          fileInfo.style.display = "flex";

          // Limpa textarea quando seleciona arquivo
          emailText.value = "";
        } else {
          fileInfo.style.display = "none";
        }
      }

      // Limpa arquivo quando digita no textarea
      emailText.addEventListener("input", function () {
        fileInput.value = "";
        document.getElementById("fileInfo").style.display = "none";
      });

      // Permite arrastar e soltar arquivos
      const uploadArea = document.querySelector(".custom-upload");
      uploadArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = "#818cf8";
        uploadArea.style.background =
          "linear-gradient(145deg, #2d3748, #1e293b)";
      });

      uploadArea.addEventListener("dragleave", () => {
        uploadArea.style.borderColor = "#475569";
        uploadArea.style.background =
          "linear-gradient(145deg, #1e293b, #0f172a)";
      });

      uploadArea.addEventListener("drop", (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = "#475569";
        uploadArea.style.background =
          "linear-gradient(145deg, #1e293b, #0f172a)";

        if (e.dataTransfer.files.length) {
          fileInput.files = e.dataTransfer.files;
          updateFileName();
        }
      });

      // Envio do formulário
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(form);
        const hasText = emailText.value.trim().length > 0;
        const hasFile = fileInput.files.length > 0;

        if (!hasText && !hasFile) {
          showToast("Por favor, insira um texto ou selecione um arquivo");
          return;
        }

        // Desabilita botão e mostra loading
        submitBtn.disabled = true;
        submitBtn.innerHTML =
          '<span class="loading-spinner" style="border-width: 2px; width: 18px; height: 18px; margin-right: 10px;"></span><span>Analisando...</span>';
        loading.style.display = "block";

        try {
          const res = await fetch("/analyze", {
            method: "POST",
            body: formData,
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error || "Erro ao analisar email");
          }

          const data = await res.json();

          // Atualiza modal COM A CLASSIFICAÇÃO (PARTE IMPORTANTE!)
          document.getElementById("badge").textContent = data.category;
          document.getElementById("badge").className = "badge " + data.category;
          document.getElementById("summary").textContent = data.summary;
          document.getElementById("response").textContent = data.response;

          // Adiciona descrição baseada na categoria
          if (data.category === "Produtivo") {
            classificationSubtitle.textContent =
              "Este email requer atenção imediata da equipe";
          } else {
            classificationSubtitle.textContent =
              "Este email não requer ação imediata";
          }

          // Mostra modal
          modal.style.display = "flex";
          form.reset();
          document.getElementById("fileInfo").style.display = "none";
        } catch (error) {
          showToast(error.message);
        } finally {
          // Restaura botão
          submitBtn.disabled = false;
          submitBtn.innerHTML = "<span>🔍</span><span>Analisar Email</span>";
          loading.style.display = "none";
        }
      });

      // Copiar resposta para clipboard
      function copyResponse() {
        const responseText = document.getElementById("response").textContent;
        navigator.clipboard.writeText(responseText).then(() => {
          const btn = document.querySelector(".copy-btn");
          const originalText = btn.textContent;
          const originalHTML = btn.innerHTML;
          btn.innerHTML = "<span>✓</span><span>Copiado!</span>";
          btn.style.background = "linear-gradient(135deg, #10b981, #059669)";

          setTimeout(() => {
            btn.innerHTML = originalHTML;
            btn.style.background = "linear-gradient(135deg, #8b5cf6, #7c3aed)";
          }, 2000);
        });
      }

      // Resetar aplicação
      function resetApp() {
        modal.style.display = "none";
        form.reset();
        document.getElementById("fileInfo").style.display = "none";
        classificationSubtitle.textContent = "";
        emailText.focus();
      }

      // Mostrar toast de erro
      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.style.display = "block";

        setTimeout(() => {
          toast.style.display = "none";
        }, 4000);
      }

      // Fechar modal com ESC
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.style.display === "flex") {
          resetApp();
        }
      });

      // Fechar modal clicando fora
      modal.addEventListener("click", (e) => {
        if (e.target === modal) {
          resetApp();
        }
      });
    </script>
  </body>
</html>
